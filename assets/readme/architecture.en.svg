<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
<title id="title">Target architecture for the shared CUBRID language engine</title>
<desc id="desc">Separate consumers call a shared engine through library, LSP, and CLI interfaces. Validate a Python PoC, then migrate gradually to Rust. Only strict checks use the native CUBRID parser worker. Consumer integrations are planned.</desc>
