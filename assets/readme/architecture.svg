<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
<title id="title">CUBRID 공통 언어 엔진의 목표 아키텍처</title>
<desc id="desc">별도 소비 제품은 라이브러리, LSP, CLI로 공통 엔진을 호출합니다. Python PoC를 검증한 뒤 Rust로 점진 전환합니다. 문법 검사만 네이티브 CUBRID 파서 워커를 사용합니다. VS Code·Neovim 알파는 LSP를 사용하며 TUI·AI 연동은 예정입니다.</desc>
