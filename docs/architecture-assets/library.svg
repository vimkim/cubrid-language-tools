<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="830" viewBox="0 0 1240 830" role="img" aria-labelledby="library-title library-desc">
<title id="library-title">Recommended library with LSP and CLI adapters</title>
<desc id="library-desc">Four independently released consumers send requests through shared adapters to a centrally maintained CUBRID language core. The shaded area is one central project.</desc>
