[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cubrid-language-tools"
version = "0.1.0.dev0"
description = "Shared CUBRID completion and offline language diagnostics"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = []

[project.optional-dependencies]
lsp = [
    "pygls==2.1.1",
    "lsprotocol==2025.0.0",
    "attrs==25.4.0",
    "cattrs==25.3.0",
    "typing-extensions==4.15.0",
    "exceptiongroup==1.3.1; python_version < '3.11'",
]

[project.scripts]
cubrid-lint = "cubrid_language.cli:main"
cubrid-language-server = "cubrid_language.lsp:main"

[tool.setuptools.packages.find]
where = ["src"]
